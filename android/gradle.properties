# Sized for a modest dev machine. The Flutter template default (-Xmx8G) asks the
# JVM to reserve more heap than a typical laptop has, which gets the daemon
# OOM-killed part-way through a build. Raise this on a bigger machine.
org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=768M -XX:ReservedCodeCacheSize=192m
org.gradle.parallel=false
org.gradle.workers.max=1
# Compile Kotlin inside the Gradle daemon rather than forking a second JVM.
# Two JVMs do not fit in this machine's memory budget.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
