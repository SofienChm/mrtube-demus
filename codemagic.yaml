# Codemagic workflow — builds the iOS app and publishes it to App Store Connect
# (TestFlight).
#
# Same signing flow as the working miniminds-web config: the codemagic CLI tools
# fetch the cert + profile with the App Store Connect API key, install them,
# apply the profile to the project, then build.
#
# The iOS project IS COMMITTED (ios/) — Codemagic only syncs it, it does not
# regenerate it. Two consequences worth knowing:
#
#   * Do not run `flutter create .` on a build machine. That rewrites the Xcode
#     project and silently drops signing settings.
#   * `ios/Flutter/Generated.xcconfig` and `ios/Flutter/ephemeral/` are
#     gitignored (correctly) and are regenerated on each build by `flutter pub
#     get`, so they are never in the repo.
#
# This project uses Swift Package Manager for plugins, NOT CocoaPods — there is
# no `ios/Podfile` and `flutter build ipa` does not run `pod install`. That is
# why there is no pod step below, matching miniminds-web. If a plugin with a
# CocoaPods podspec is ever added, this breaks and needs a `pod install` step.
#
# Verified against this repo rather than assumed:
#   * Bundle id          com.mrplay.mrplayNew
#   * Scheme / project   Runner (ios/Runner.xcodeproj)
#   * Deployment target  iOS 15.0
#   * Display name       MrPlay
#   * Projected Flutter  3.47.6 stable
#
# Setup required in Codemagic (one-time):
#   1. App Store Connect integration named "codemagic full access".
#   2. On this app's "Environment variables" page, copy the four variables that
#      miniminds-web uses: CERTIFICATE_PRIVATE_KEY, APP_STORE_CONNECT_PRIVATE_KEY,
#      APP_STORE_CONNECT_KEY_IDENTIFIER and APP_STORE_CONNECT_ISSUER_ID (exact
#      values from the working miniminds-web project).
#   3. Register com.mrplay.mrplayNew in App Store Connect and in the Apple
#      developer portal. Note the capital N: this is Flutter's generated id, and
#      it is NOT com.mrplay.mrplay_new.
#   4. Nothing else. The workflow is at the repo root, so working_directory is the
#      repo root — unlike miniminds-web, which builds from frontend/erp-app.

workflows:
  ios-build:
    name: iOS Build
    # Repo root. The Flutter project is at the top level, not in a subfolder.
    working_directory: .
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic full access

    environment:
      # Newer than miniminds-web's node 22 line: this project needs Flutter
      # 3.47.6 stable, which requires Dart 3.10 or newer.
      flutter: 3.47.6
      xcode: latest
      cocoapods: default
      groups:
        - default

    scripts:
      # 1. pub get first. It generates ios/Flutter/Generated.xcconfig and the SPM
      #    plugin package that the committed Xcode project references but that
      #    does not exist in a fresh clone.
      - name: Resolve Flutter dependencies
        script: |
          flutter pub get

      # 2. Fail early and legibly on the two input mistakes that are otherwise
      #    discovered by the export step, which reports them confusingly.
      - name: Verify iOS build inputs
        script: |
          set -euo pipefail

          echo "Working directory: $(pwd)"

          # Absolute path from $(pwd), not $CI_PROJECT_ROOT: Codemagic does not
          # define CI_PROJECT_ROOT, so it expanded to an empty string and the
          # path became "/ios/ExportOptions.plist", which does not exist.
          # $(pwd) is correct because working_directory pins this to the repo
          # root, and earlier steps already rely on that with relative ios/ paths.
          export_options="$(pwd)/ios/ExportOptions.plist"
          if [ ! -f "$export_options" ]; then
            echo "::error::Export options plist not found at $export_options"
            echo "Contents of ios/:"
            ls -la ios/ || true
            exit 1
          fi
          echo "Export options: $export_options"

          # No pod install step on purpose (plugins resolve through Swift Package
          # Manager). If a plugin ever adds a CocoaPods podspec, fail now rather
          # than much later with a confusing link error.
          if [ -f ios/Podfile ]; then
            echo "::error::ios/Podfile exists but this workflow has no 'pod install' step."
            echo "Add a CocoaPods install step to codemagic.yaml before shipping."
            exit 1
          fi
          echo "No Podfile: Swift Package Manager build. OK"

      # Deliberately no `agvtool new-version` step.
      #
      # It looks correct but does nothing here: this project's Release config
      # sets CURRENT_PROJECT_VERSION to $(FLUTTER_BUILD_NUMBER), which overrides
      # the project-level literal agvtool rewrites. That variable comes from
      # Generated.xcconfig, which is derived from the version in pubspec.yaml, so
      # every build would ship as CFBundleVersion 1 and App Store Connect would
      # reject the second upload as a duplicate.
      #
      # The build number is passed to `flutter build ipa` as --build-number
      # instead, which writes it where the Xcode setting actually reads it.

      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files com.mrplay.mrplayNew \
            --type IOS_APP_STORE \
            --create \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY"

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Clean Xcode build
        script: |
          xcodebuild clean \
            -project ios/Runner.xcodeproj \
            -scheme Runner

      # Flutter's own archiving, not a bare xcodebuild archive. It runs SPM plugin
      # resolution, compiles Dart to AOT and assembles the app, which a bare
      # xcodebuild archive would not do.
      #
      # --no-codesign is deliberate here, unlike earlier revisions. Flutter checks
      # the flag and returns before exporting (build_ios.dart: "Codesigning
      # disabled with --no-codesign, skipping IPA."), so this produces the
      # xcarchive and no IPA, exiting 0. That is exactly what is wanted: signing
      # and export are done explicitly in the next step, because Flutter signs from
      # its own saved config rather than from the Xcode project.
      - name: Build the unsigned archive
        script: |
          # NOTE: --export-method and --export-options-plist are mutually
          # exclusive. Passing both fails with:
          #   "--export-options-plist" is not compatible with "--export-method"
          # The plist is the one that matters, because it carries
          # upload-symbols and manageAppVersionAndNumber=false. The method comes
          # from its "method" key instead of a separate flag.
          #
          # --no-codesign here is deliberate and correct: Flutter returns before
          # exporting, which is what we want, because the next step signs the
          # archived .app and calls xcodebuild -exportArchive itself.
          flutter build ipa \
            --release \
            --no-codesign \
            --build-number="$BUILD_NUMBER"

          if [ ! -d build/ios/archive/Runner.xcarchive ]; then
            echo "::error::no xcarchive was produced"
            exit 1
          fi
      # Flutter signs from its own saved config, not from the Xcode project, and
      # passes those settings straight to xcodebuild as command line overrides
      # (flutter_tools mac.dart: "buildCommands.add('${entry.key}=${entry.value}')",
      # sourced from code_signing.dart which reads ~/.config/flutter settings).
      # So `xcode-project use-profiles` writes the profile into the project and
      # Flutter then overrides it away. The archive is therefore signed without an
      # embedded profile and xcodebuild -exportArchive refuses it:
      #
      #   error: exportArchive "Runner.app" requires a provisioning profile.
      #
      # Signing the archived app explicitly removes that ambiguity: resolve the
      # profile by decoding it and matching the bundle id, embed it, codesign the
      # nested code then the app, and export with xcodebuild directly.
      - name: Diagnose archive signing state
        script: |
          echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
          echo "Flutter: $(flutter --version --machine | head -c 200)"
          APP=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          echo "App: $APP"
          echo "--- codesign -dvvv (current archive state) ---"
          codesign -dvvv "$APP" 2>&1 | grep -Ei "Identifier|Authority|TeamIdentifier|Signature|Format" || echo "(unsigned)"
          echo "--- embedded.mobileprovision present? ---"
          if [ -f "$APP/embedded.mobileprovision" ]; then
            echo "YES"
          else
            echo "NO  <- this is why export fails"
          fi
          echo "--- profiles on this machine ---"
          find "$HOME/Library/MobileDevice/Provisioning Profiles" ./profile "$HOME/.codemagic" \
            -name '*.mobileprovision' 2>/dev/null | while read -r f; do
            echo "  $f"
          done
          echo "--- signing identities ---"
          security find-identity -v -p codesigning 2>/dev/null | sed 's/^/  /' || true
          echo "--- Release build settings ---"
          xcodebuild -showBuildSettings -project ios/Runner.xcodeproj -scheme Runner -configuration Release 2>/dev/null \
            | grep -E "^ *(CODE_SIGN|PROVISIONING_PROFILE|DEVELOPMENT_TEAM)" | sort -u | sed 's/^/  /' || true

      - name: Sign the archived app and export the IPA
        script: |
          set -euo pipefail

          ARCHIVE=build/ios/archive/Runner.xcarchive
          APP="$ARCHIVE/Products/Applications/Runner.app"
          BUNDLE_ID="com.mrplay.mrplayNew"
          WORK="$(mktemp -d)"

          # Resolve the provisioning profile by decoding each candidate and
          # matching its application-identifier against our bundle id. Matching on
          # the decoded content rather than the filename, because the filename is
          # a UUID that changes on every --create run.
          find "$HOME/Library/MobileDevice/Provisioning Profiles" ./profile "$HOME/.codemagic" \
            -name '*.mobileprovision' > "$WORK/profiles.txt" 2>/dev/null || true
          echo "Found $(wc -l < "$WORK/profiles.txt" | tr -d ' ') candidate profile(s)"

          PROFILE=""
          while read -r candidate; do
            if ! security cms -D -i "$candidate" > "$WORK/candidate.plist" 2>/dev/null; then
              continue
            fi
            app_id="$(plutil -extract Entitlements.application-identifier raw -o - "$WORK/candidate.plist" 2>/dev/null || echo '')"
            if [ "${app_id##*.}" = "$BUNDLE_ID" ]; then
              echo "Matched profile: $candidate"
              echo "  name:    $(plutil -extract Name raw -o - "$WORK/candidate.plist")"
              echo "  app id:  $app_id"
              echo "  team:    $(plutil -extract TeamIdentifier.0 raw -o - "$WORK/candidate.plist")"
              echo "  expires: $(plutil -extract ExpirationDate raw -o - "$WORK/candidate.plist")"
              PROFILE="$candidate"
              cp "$WORK/candidate.plist" "$WORK/profile.plist"
              break
            fi
          done < "$WORK/profiles.txt"

          if [ -z "$PROFILE" ]; then
            echo "::error::no provisioning profile found whose application-identifier ends in .$BUNDLE_ID"
            echo "Searched: ~/Library/MobileDevice/Provisioning Profiles, ./profile, ~/.codemagic"
            echo "If the list above was empty, the earlier fetch-signing-files step"
            echo "created nothing, so check its output and the App Store Connect setup."
            exit 1
          fi

          TEAM="$(plutil -extract Entitlements.application-identifier raw -o - "$WORK/profile.plist")"
          TEAM="${TEAM%%.*}"

          # Use the entitlements from the profile so the signature matches what
          # Apple expects, rather than an empty or guessed set.
          plutil -extract Entitlements xml1 -o "$WORK/entitlements.plist" "$WORK/profile.plist"
          echo "Entitlements to apply:"
          plutil -p "$WORK/entitlements.plist" | sed 's/^/  /'

          # Embed the profile, then sign. Nested code must be signed before the
          # enclosing bundle or verification of the app fails.
          cp "$PROFILE" "$APP/embedded.mobileprovision"

          SIGN_IDENTITY="Apple Distribution"
          if ! security find-identity -v -p codesigning | grep -q "Apple Distribution"; then
            SIGN_IDENTITY="$(security find-identity -v -p codesigning | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)"
          fi
          echo "Signing with: $SIGN_IDENTITY (team $TEAM)"

          # Sign nested code before the enclosing bundle, or verification of the
          # app fails. Globbing with quotes keeps any spaces intact.
          for nested in "$APP"/Frameworks/*.framework "$APP"/Frameworks/*.dylib; do
            [ -e "$nested" ] || continue
            codesign --force --sign "$SIGN_IDENTITY" --timestamp "$nested"
            echo "  signed ${nested##*/}"
          done

          codesign --force \
            --sign "$SIGN_IDENTITY" \
            --entitlements "$WORK/entitlements.plist" \
            --options runtime \
            --timestamp \
            "$APP"

          echo "--- verifying ---"
          codesign --verify --verbose=2 "$APP" 2>&1 | sed 's/^/  /'
          codesign -dvvv "$APP" 2>&1 | grep -Ei "Identifier|Authority|TeamIdentifier|Signature" | sed 's/^/  /'

          rm -rf build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$(pwd)/ios/ExportOptions.plist" \
            -exportPath build/ios/ipa

          echo "--- exported ---"
          ls -la build/ios/ipa/

      - name: Verify the IPA was signed with the distribution profile
        script: |
          set -euo pipefail
          mkdir -p ipa_unzip
          ipa=$(ls -1 build/ios/ipa/*.ipa | head -1)
          unzip -q -o "$ipa" -d ipa_unzip

          app_dir=$(find ipa_unzip/Payload -maxdepth 1 -name "*.app" | head -1)
          codesign -dvvv "$app_dir" 2>&1 | tee signature.txt

          grep -q "Authority=Apple Distribution" signature.txt || {
            echo "::error::IPA is not signed with an Apple Distribution certificate."
            exit 1
          }

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Builds an iOS Simulator archive without signing. Useful for checking that the
  # Dart side compiles for iOS at all, at no signing cost and with no App Store
  # Connect dependency.
  ios-simulator-build:
    name: iOS Simulator Build (no signing)
    working_directory: .
    max_build_duration: 45
    instance_type: mac_mini_m2

    environment:
      flutter: 3.47.6
      xcode: latest
      groups:
        - default

    scripts:
      - name: Resolve Flutter dependencies
        script: |
          flutter pub get

      - name: Build for the iOS simulator
        script: |
          flutter build ios --simulator --debug